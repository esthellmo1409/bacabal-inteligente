<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Bacabal Conecta</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div id="top"></div>

    <div class="panel login-box" style="text-align:center">
      <img src="/assets/logo-prefeitura.png" alt="Brasão oficial" style="width:88px;height:auto;margin:0 auto 1rem;display:block;background:#111;border-radius:50%;padding:6px" />
      <div class="flag-bar" style="margin:0 auto 1rem"><span></span><span></span><span></span></div>
      <p class="eyebrow">Área administrativa</p>
      <h1 class="display" style="font-size:clamp(1.6rem,4vw,2rem);margin-bottom:0.35rem">Acesso restrito</h1>
      <p class="muted" style="margin-bottom:1.25rem;font-weight:500;letter-spacing:-0.015em">Somente servidores autorizados da Prefeitura de Bacabal</p>

      <div style="text-align:left">
        <label>Perfil</label>
        <select id="perfil">
          <option value="prefeito">Gabinete do Prefeito</option>
          <option value="obras" selected>Secretaria de Obras</option>
          <option value="campo">Equipe de campo (tablet na rua)</option>
          <option value="iluminacao">Iluminação Pública</option>
          <option value="limpeza">Limpeza Urbana</option>
          <option value="saude">Secretaria de Saúde</option>
          <option value="eventos">Cultura e Eventos</option>
          <option value="admin">Administrador</option>
        </select>
        <label>Usuário</label>
        <input id="usuario" value="obras" />
        <label>Senha</label>
        <input id="senha" type="password" value="obras123" />
        <button class="btn btn-primary" id="entrar" style="width:100%">Entrar</button>
      </div>

      <p class="muted" style="margin-top:1rem;font-size:0.8rem">
        Campo: campo/campo123 · Obras: obras/obras123 · Saúde: saude/saude123
      </p>
    </div>

    <div class="footer">
      <span>Protótipo · sem integração real de SSO</span>
      <a href="/cidadao.html">Sou cidadão — abrir chamado</a>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    initCidade();
    const senhas = {
      prefeito: 'prefeito123',
      obras: 'obras123',
      campo: 'campo123',
      iluminacao: 'luz123',
      limpeza: 'limpo123',
      saude: 'saude123',
      eventos: 'evento123',
      admin: 'admin123',
    };

    (async () => {
      const cfg = await loadCityBrand();
      document.getElementById('top').innerHTML = topbar('Login', cfg);
      rewriteCityLinks();
      if (cfg && (cfg.slug === 'bomlugar' || getCidade() === 'bomlugar')) {
        const opt = document.querySelector('#perfil option[value="prefeito"]');
        if (opt) opt.textContent = 'Gabinete da Prefeita';
      }
    })();

    document.getElementById('perfil').onchange = () => {
      const p = document.getElementById('perfil').value;
      document.getElementById('usuario').value = p;
      document.getElementById('senha').value = senhas[p] || 'admin123';
    };

    document.getElementById('entrar').onclick = async () => {
      const btn = document.getElementById('entrar');
      await withBusy(btn, 'Entrando…', async () => {
        try {
          const cidade = getCidade();
          const r = await api('/api/login', {
            method: 'POST',
            body: JSON.stringify({
              usuario: document.getElementById('usuario').value.trim(),
              senha: document.getElementById('senha').value,
              cidade,
            }),
          });
          localStorage.setItem('bi_token', r.token);
          if (typeof setSession === 'function') setSession(r.token, r.user);
          else localStorage.setItem('bi_user', JSON.stringify(r.user));
          toast('Bem-vindo, ' + r.user.nome);
          if (r.user.papel === 'admin') {
            location.href = cityLink('/admin-sistema.html');
          } else if (r.user.papel === 'prefeito') {
            location.href = cityLink('/prefeito.html');
          } else if (r.user.papel === 'campo') {
            location.href = cityLink('/equipes.html');
          } else {
            location.href = cityLink('/secretaria.html');
          }
        } catch (e) {
          toast(e.message);
        }
      });
    };
  </script>
</body>
</html>
