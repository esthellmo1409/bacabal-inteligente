<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa Inteligente · Bacabal Conecta</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="wrap-wide">
    <div id="top"></div>
    <h1 class="display" style="font-size:1.75rem;margin-bottom:0.35rem">Mapa Inteligente</h1>
    <p class="muted" style="margin-bottom:1rem">Satélite com nomes de ruas · filtros · calor · rotas · equipes</p>
    <div class="panel" style="margin-bottom:1rem">
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">
        <div class="map-search">
          <input id="fBusca" type="search" placeholder="Buscar protocolo, bairro, categoria…" style="margin:0" />
          <button type="button" id="fBuscaBtn" title="Buscar" aria-label="Buscar">🔍</button>
        </div>
        <select id="fStatus" style="margin:0"><option value="">Status</option></select>
        <select id="fSec" style="margin:0"><option value="">Secretaria</option></select>
        <select id="fBai" style="margin:0"><option value="">Bairro</option></select>
        <select id="fPri" style="margin:0">
          <option value="">Prioridade</option>
          <option value="baixa">Baixa</option><option value="media">Média</option>
          <option value="alta">Alta</option><option value="urgente">Urgente</option>
        </select>
        <input id="fDe" type="date" style="margin:0" />
        <input id="fAte" type="date" style="margin:0" />
        <label class="meta"><input type="checkbox" id="heat" /> Calor</label>
        <label class="meta"><input type="checkbox" id="rota" /> Rotas</label>
        <label class="meta"><input type="checkbox" id="live" checked /> Equipes ao vivo</label>
        <button class="btn btn-sm btn-primary" id="aplicar">Aplicar</button>
        <span class="count" id="count">0</span>
      </div>
    </div>
    <div class="map-shell"><div id="map" class="map" style="height:560px"></div></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="/app.js"></script>
  <script src="/map.js"></script>
  <script>
    setCidade(new URLSearchParams(location.search).get('cidade') || getCidade());
    let map, markers, heatLayer, routeLine, cfg;

    async function boot() {
      cfg = await loadCityBrand();
      document.getElementById('top').innerHTML = topbar('Módulos', cfg);
      document.getElementById('fStatus').innerHTML = '<option value="">Status</option>' + statusOptions();
      document.getElementById('fSec').innerHTML = '<option value="">Secretaria</option>' +
        (cfg.secretarias || []).map(s => `<option value="${s.id}">${s.nome}</option>`).join('');
      document.getElementById('fBai').innerHTML = '<option value="">Bairro</option>' +
        (cfg.bairros || []).map(b => `<option>${b}</option>`).join('');
      map = L.map('map').setView([cfg.lat, cfg.lng], 15);
      MapBI.basemaps(map, 'hybrid');
      markers = L.layerGroup().addTo(map);
      await apply();
      setInterval(() => { if (live.checked) loadLive(); }, 15000);
    }

    async function apply() {
      const q = new URLSearchParams();
      if (fStatus.value) q.set('status', fStatus.value);
      if (fSec.value) q.set('secretaria', fSec.value);
      if (fBai.value) q.set('bairro', fBai.value);
      if (fPri.value) q.set('prioridade', fPri.value);
      if (fDe.value) q.set('de', fDe.value);
      if (fAte.value) q.set('ate', fAte.value);
      const list = await api('/api/chamados?' + q.toString());
      markers.clearLayers();
      if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }

      const pts = list.filter(c => c.lat && c.lng);
      const q = (document.getElementById('fBusca').value || '').trim().toLowerCase();
      const filtered = q
        ? pts.filter(c => [
            c.protocolo, c.titulo, c.categoria, c.bairro, c.descricao, c.secretaria, c.status,
          ].join(' ').toLowerCase().includes(q))
        : pts;
      document.getElementById('count').textContent = filtered.length + ' no mapa';

      if (heat.checked && window.L && L.heatLayer) {
        heatLayer = L.heatLayer(filtered.map(c => [c.lat, c.lng, c.prioridade === 'urgente' ? 0.9 : 0.5]), { radius: 28 }).addTo(map);
      } else {
        filtered.forEach(c => {
          L.circleMarker([c.lat, c.lng], {
            radius: 8, color: '#fff', weight: 2,
            fillColor: MapBI.STATUS_COLOR[c.status] || (c.prioridade === 'urgente' || c.prioridade === 'alta' ? '#e74c3c' : '#FF8000'),
            fillOpacity: 0.9,
          }).bindPopup(MapBI.popupHtml(c), { maxWidth: 280 }).addTo(markers);
        });
      }

      if (rota.checked) {
        const r = await api('/api/rota?lat=' + cfg.lat + '&lng=' + cfg.lng + (fSec.value ? '&secretaria=' + fSec.value : ''));
        const latlngs = [[cfg.lat, cfg.lng], ...r.rota.map(p => [p.lat, p.lng])];
        routeLine = L.polyline(latlngs, { color: '#398A21', weight: 3 }).addTo(map);
      }
      await loadLive();
    }

    async function loadLive() {
      if (!live.checked) return;
      const track = await api('/api/rastreamento');
      track.forEach(t => {
        L.marker([t.lat, t.lng]).bindPopup(`Equipe ${t.equipeId}<br>${fmtDate(t.atualizadoEm)}`).addTo(markers);
      });
    }

    document.getElementById('aplicar').onclick = () => apply().catch(e => toast(e.message));
    document.getElementById('fBuscaBtn').onclick = () => apply().catch(e => toast(e.message));
    document.getElementById('fBusca').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); apply().catch(err => toast(err.message)); }
    });
    boot().catch(e => toast(e.message));
  </script>
</body>
</html>
