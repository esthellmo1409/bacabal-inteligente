<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa da cidade · Bacabal Conecta</title>
  <link rel="stylesheet" href="/styles.css" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="icon" href="/assets/logo-prefeitura.png" />
  <style>
    .map-mode-bar {
      display: flex; gap: 0.35rem; flex-wrap: wrap;
      position: absolute; top: 12px; left: 12px; z-index: 5;
    }
    .map-mode-bar button {
      border: 0; border-radius: 999px; padding: 0.45rem 0.85rem;
      font: 700 0.75rem Manrope, system-ui, sans-serif;
      background: rgba(255,255,255,.92); color: #1a1a1a;
      box-shadow: 0 6px 20px rgba(0,0,0,.18); cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .map-mode-bar button.on {
      background: linear-gradient(135deg, #ff8000, #2f8a28); color: #fff;
    }
    .map-shell-gl { position: relative; }
    .map-shell-gl #map {
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 560px;
      border: 0;
      border-radius: 0;
    }
    .gl-marker {
      width: 18px; height: 18px; border: 0; padding: 0;
      background: transparent; cursor: pointer;
    }
    .gl-marker span {
      display: block; width: 14px; height: 14px; margin: 2px;
      border-radius: 50%; background: var(--c, #f07800);
      border: 2.5px solid #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .gl-marker-urgent span {
      width: 16px; height: 16px; margin: 1px;
      animation: biPulse 1.5s ease-out infinite;
    }
    .maplibregl-popup-content {
      border-radius: 14px; padding: 0; overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.22);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .maplibregl-popup-content .bi-popup { padding: 0.75rem; }
    .maplibregl-ctrl-group { border-radius: 12px !important; overflow: hidden; }
  </style>
</head>
<body class="ops-body">
  <div class="wrap-wide">
    <div id="top"></div>

    <header class="page-hero">
      <div>
        <p class="page-kicker">Território · mapa premium</p>
        <h1 class="display page-title">Mapa da cidade</h1>
        <p class="muted page-sub">Mapa vetorial 3D (tipo Google Maps) · satélite · zoom suave sem tela cinza</p>
      </div>
      <div class="page-hero-actions" id="mapHeroActions">
        <a class="btn btn-sm btn-primary" href="/cidadao.html?cidade=bacabal">Abrir chamado</a>
      </div>
    </header>

    <div class="grid-4 map-kpis" id="kpis">
      <div class="panel stat"><div class="label">No mapa</div><div class="value" id="kTotal">—</div></div>
      <div class="panel stat"><div class="label">Abertos</div><div class="value" id="kAbertos">—</div></div>
      <div class="panel stat"><div class="label">Em execução</div><div class="value" id="kExec">—</div></div>
      <div class="panel stat"><div class="label">Urgentes / alta</div><div class="value" id="kUrg">—</div></div>
    </div>

    <div class="map-ops">
      <aside class="map-ops-side panel">
        <div class="map-ops-filters">
          <div class="map-search">
            <input id="fBusca" type="search" placeholder="Protocolo, bairro, categoria…" style="margin:0" />
            <button type="button" id="fBuscaBtn" title="Buscar" aria-label="Buscar">🔍</button>
          </div>
          <select id="fStatus" style="margin:0"><option value="">Status</option></select>
          <select id="fSec" style="margin:0"><option value="">Secretaria</option></select>
          <select id="fBai" style="margin:0"><option value="">Bairro</option></select>
          <select id="fPri" style="margin:0">
            <option value="">Prioridade</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
          <div class="cta-row" style="margin-top:0.35rem">
            <button class="btn btn-sm btn-primary" id="aplicar" type="button">Aplicar</button>
            <button class="btn btn-sm" id="limpar" type="button">Limpar</button>
          </div>
          <p class="muted" style="margin:0.35rem 0 0;font-size:0.78rem"><span id="count">0</span> ocorrências</p>
        </div>
        <div class="map-ops-list" id="lista"></div>
      </aside>

      <div class="map-ops-main">
        <div class="map-shell map-shell-gl">
          <div class="map-mode-bar" id="modeBar">
            <button type="button" class="on" data-mode="3d">Ruas 3D</button>
            <button type="button" data-mode="hybrid">Híbrido</button>
            <button type="button" data-mode="sat">Satélite</button>
          </div>
          <div id="map"></div>
          <div id="mapLegend"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/app.js"></script>
  <script src="/map.js"></script>
  <script src="/map-gl.js"></script>
  <script>
    setCidade(new URLSearchParams(location.search).get('cidade') || getCidade());
    let state, cfg, allList = [], selectedId = null, filtered = [];

    function tempoRel(iso) {
      if (!iso) return '';
      const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
      if (min < 60) return 'há ' + min + ' min';
      const h = Math.round(min / 60);
      if (h < 48) return 'há ' + h + 'h';
      return 'há ' + Math.round(h / 24) + 'd';
    }

    function cardHtml(c) {
      const foto = MapGL.fotoUrl(c);
      const active = selectedId === c.id ? ' is-active' : '';
      return `
        <button type="button" class="map-card${active}" data-id="${c.id}" data-lat="${c.lat}" data-lng="${c.lng}">
          <div class="map-card-foto ${foto ? '' : 'sem'}">${foto ? `<img src="${foto}" alt="" />` : '<span>Sem foto</span>'}</div>
          <div class="map-card-body">
            <div class="map-card-top">
              <strong>${c.titulo || c.categoria}</strong>
              ${badge(c.status)}
            </div>
            <div class="meta">${c.protocolo || '—'} · ${c.bairro || '—'} · ${tempoRel(c.atualizadoEm || c.criadoEm)}</div>
            <p>${(c.descricao || '').slice(0, 90)}${(c.descricao || '').length > 90 ? '…' : ''}</p>
          </div>
        </button>`;
    }

    function updateKpis(list) {
      const abertos = list.filter(c => ['novo', 'aberto', 'em_analise', 'encaminhado'].includes(c.status)).length;
      const exec = list.filter(c => ['em_execucao', 'em_andamento', 'aguardando_material', 'aguardando_aprovacao'].includes(c.status)).length;
      const urg = list.filter(c => c.prioridade === 'urgente' || c.prioridade === 'alta').length;
      kTotal.textContent = list.length;
      kAbertos.textContent = abertos;
      kExec.textContent = exec;
      kUrg.textContent = urg;
    }

    function bindList() {
      lista.querySelectorAll('.map-card').forEach(btn => {
        btn.onclick = () => {
          selectedId = btn.dataset.id;
          lista.querySelectorAll('.map-card').forEach(el => el.classList.toggle('is-active', el === btn));
          MapGL.focusPoint(state, selectedId);
        };
      });
    }

    async function boot() {
      cfg = await loadCityBrand();
      document.getElementById('top').innerHTML = topbar('Mapa', cfg);
      document.getElementById('mapLegend').innerHTML = MapBI.legendHtml();

      const u = (typeof getSessionUser === 'function') ? getSessionUser() : null;
      const actions = document.getElementById('mapHeroActions');
      if (actions && u && ['prefeito', 'admin', 'secretaria'].includes(u.papel)) {
        if (u.papel === 'prefeito' || u.papel === 'admin') {
          actions.insertAdjacentHTML('beforeend',
            `<a class="btn btn-sm" href="${cityLink('/prefeito.html')}">Gabinete</a>`);
        }
        if (u.papel === 'secretaria' || u.papel === 'admin') {
          actions.insertAdjacentHTML('beforeend',
            `<a class="btn btn-sm" href="${cityLink('/secretaria.html')}">Minha secretaria</a>`);
        }
      }

      fStatus.innerHTML = '<option value="">Status</option>' + statusOptions();
      fSec.innerHTML = '<option value="">Secretaria</option>' +
        (cfg.secretarias || []).map(s => `<option value="${s.id}">${s.nome}</option>`).join('');
      fBai.innerHTML = '<option value="">Bairro</option>' +
        (cfg.bairros || []).map(b => `<option>${b}</option>`).join('');

      state = MapGL.create('map', {
        center: [cfg.lng, cfg.lat],
        zoom: 13.6,
        pitch: 48,
        bearing: -18,
        onSelect: (p) => {
          selectedId = p.id;
          lista.querySelectorAll('.map-card').forEach(el => {
            el.classList.toggle('is-active', el.dataset.id === p.id);
            if (el.dataset.id === p.id) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          });
        },
      });

      state.map.on('load', () => {
        MapGL.setMode(state, '3d');
        apply().catch(e => toast(e.message));
      });

      document.querySelectorAll('#modeBar button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('#modeBar button').forEach(b => b.classList.toggle('on', b === btn));
          MapGL.setMode(state, btn.dataset.mode);
        };
      });

      setTimeout(() => state.map.resize(), 250);
    }

    async function apply() {
      const q = new URLSearchParams();
      if (fStatus.value) q.set('status', fStatus.value);
      if (fSec.value) q.set('secretaria', fSec.value);
      if (fBai.value) q.set('bairro', fBai.value);
      if (fPri.value) q.set('prioridade', fPri.value);
      allList = await api('/api/chamados?' + q.toString());
      const pts = allList.filter(c => c.lat && c.lng);
      const query = (fBusca.value || '').trim().toLowerCase();
      filtered = query
        ? pts.filter(c => [
            c.protocolo, c.titulo, c.categoria, c.bairro, c.descricao, c.secretaria, c.status,
          ].join(' ').toLowerCase().includes(query))
        : pts;

      filtered.sort((a, b) => String(b.atualizadoEm || b.criadoEm || '').localeCompare(String(a.atualizadoEm || a.criadoEm || '')));

      count.textContent = filtered.length;
      updateKpis(filtered);
      lista.innerHTML = filtered.length
        ? filtered.slice(0, 40).map(cardHtml).join('')
        : '<p class="muted" style="padding:0.75rem">Nenhuma ocorrência com esses filtros.</p>';
      bindList();

      const ready = () => MapGL.setPoints(state, filtered, { fit: true });
      if (state.map.isStyleLoaded()) ready();
      else state.map.once('load', ready);
    }

    document.getElementById('aplicar').onclick = () => apply().catch(e => toast(e.message));
    document.getElementById('limpar').onclick = () => {
      fBusca.value = ''; fStatus.value = ''; fSec.value = ''; fBai.value = ''; fPri.value = '';
      apply().catch(e => toast(e.message));
    };
    document.getElementById('fBuscaBtn').onclick = () => apply().catch(e => toast(e.message));
    document.getElementById('fBusca').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); apply().catch(err => toast(err.message)); }
    });

    boot().catch(e => toast(e.message));
  </script>
</body>
</html>
